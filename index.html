		function buyIt(x){
			let affordable = true
			if(gameStuff.upgrades[x].gte(upgrades[x].limit()) && x!="A|5:C")
				return 0
			for(let i=0;i<upgrades[x].currencyRequired().length;i++){
				if(gameStuff[upgrades[x].currencyRequired()[i]].lt(upgrades[x].cost()[i]))
					affordable = false
			}
			if(!gameStuff["A|5"]){
				switch(x){
					case "A|5:A":
						gameStuff["A|5"] = "Path Buyable"
						break;
					case "A|5:B":
						gameStuff["A|5"] = "Path Bar"
						break;
					case "A|5:C":
						gameStuff["A|5"] = "Path Bag"
						break;
				}
			}
			if(x=="A|5:C"){
				let countIt = Decimal.min(gameStuff.anotherPoints, new Decimal(gameStuff.upgrades["A|8:C"].neq(0)?6750:gameStuff.upgrades["A|7:C"].neq(0)?2250:1000).sub(gameStuff["A|5:C"]))
				gameStuff.anotherPoints = gameStuff.anotherPoints.sub(countIt)
				gameStuff["A|5:C"] = gameStuff["A|5:C"].add(countIt)
			}
			if(affordable && !(x=="A|5:C" && gameStuff.upgrades[x].neq(0))){
				for(let i=0;i<upgrades[x].currencyRequired().length;i++){
					if(upgrades[x].costType()[i]=="cost") gameStuff[upgrades[x].currencyRequired()[i]]=gameStuff[upgrades[x].currencyRequired()[i]].sub(upgrades[x].cost()[i])
				}
				gameStuff.upgrades[x]=gameStuff.upgrades[x].add(1)
			}
			let offset = [pushToTheRight[1],thatNumber*3+(gameStuff.upgrades["7"].gte(1)?thatNumber*3:0)]
			for(let i=0;i<upg.length;i++){
				if(!selectElement(upg[i][0]))
					continue
				for(let v=0;v<upg[i][3].length;v++){
					if(selectElement(upg[i][3][v])){
						drawLine("line "+upg[i][0]+" connected with "+upg[i][3][v]+" but with different color",getCenterPosition(upg[i][0]).x,getCenterPosition(upg[i][0]).y,getCenterPosition(upg[i][3][v]).x,getCenterPosition(upg[i][3][v]).y,8,"black")
						drawLine("line "+upg[i][0]+" connected with "+upg[i][3][v],getCenterPosition(upg[i][0]).x,getCenterPosition(upg[i][0]).y,getCenterPosition(upg[i][3][v]).x,getCenterPosition(upg[i][3][v]).y,4,upgrades[upg[i][0]].color)
					}
				}
				centerElement(upg[i][0],upg[i][1]+offset[0],-window.innerHeight/2+thatNumber*4+upg[i][2]+thatNumber*2+offset[1])
			}
			for(let i=0;i<upg.length;i++){
				pushToTheRight[0] = Math.min(pushToTheRight[0], selectElement("shitass"+upg[i][0]).getBoundingClientRect().left-thatNumber/8)
			}
			if(pushToTheRight[0]!=-pushToTheRight[1])
				pushToTheRight[1] = -pushToTheRight[0]
		}

		function createElement(id){

			document.body.appendChild(element)

		function getCenterPosition(id){
			return {x: document.getElementById(id).getBoundingClientRect().left+document.getElementById(id).getBoundingClientRect().width/2, y: document.getElementById(id).getBoundingClientRect().top+document.getElementById(id).getBoundingClientRect().height/2}
		}

		function centerElement(x,xOffset,yOffset){
			selectElement(x).style["transform"] = "translate3d("+((window.innerWidth-document.getElementById(x).getBoundingClientRect().width)/2+xOffset)+"px, "+((window.innerHeight-document.getElementById(x).getBoundingClientRect().height)/2+yOffset)+"px, 0)"
		}
		
		function centerElementRelativeToAnotherElement(x, x2, offset, offset2){ 
			selectElement(x).style["margin-left"] = Number(selectElement(x2).style["margin-left"].replace("px",""))+(document.getElementById(x2).getBoundingClientRect().width-document.getElementById(x).getBoundingClientRect().width)/2+offset+"px"
			selectElement(x).style["margin-top"] = Number(selectElement(x2).style["margin-top"].replace("px",""))+(document.getElementById(x2).getBoundingClientRect().height-document.getElementById(x).getBoundingClientRect().height)/2+offset2+"px"
		}
		
		function drawLine(id,x,y,X,Y,thickness,color){ 
			if(!selectElement(id)) selectElement("svg").innerHTML += `<line id="${id}"/>`
			selectElement(id).x1.baseVal.value = x
			selectElement(id).y1.baseVal.value = y
			selectElement(id).x2.baseVal.value = X
			selectElement(id).y2.baseVal.value = Y
			selectElement(id).style.stroke = color
			selectElement(id).style["stroke-width"] = thickness
			selectElement(id).style["stroke-linecap"] = "round"
		}
		
		function insetBorder(top,bottom,left,right,blur,color){
			let text = ``
			for(let i=1;i<color.length+1;i++){
				text+= (top!=0?`inset 0px ${top*i}px ${blur}px ${color[i-1]},`:``)+(bottom!=0?`inset 0px ${-bottom*i}px ${blur}px ${color[i-1]},`:``)+(left!=0?`inset ${left*i}px 0px ${blur}px ${color[i-1]},`:``)+(right!=0?`inset ${-right*i}px 0px ${blur}px ${color[i-1]},`:``)
			}
			return text[text.length-1]==","?text.slice(0,-1):text
		}

			let addAnother = upgrades["A|1"].effect()

			return [addPoint.mul(multPoint), addAnother.mul(multAnother)]
		}
